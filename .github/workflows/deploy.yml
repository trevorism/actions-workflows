name: Deploy App to GCP

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'The project on GCP which is the deploy target. Should be of the format: trevorism-<xyz>'
        required: true
        type: string
      gcp_project_id:
        description: 'The GCP project id. Should be of the format: 123456789'
        required: true
        type: string
      version:
        description: 'Version of app to deploy, in dash form (e.g. 1-3-2). When empty, resolved from appVersion in gradle.properties.'
        required: false
        type: string
        default: ''
      JDK_VERSION:
        required: false
        type: string
        default: '25'
      promote:
        description: 'Whether to promote the deployed version to serve live traffic.'
        required: false
        type: boolean
        default: true
    outputs:
      version_url:
        description: 'The version-specific URL of the deployed App Engine version'
        value: ${{ jobs.deliver.outputs.version_url }}
    secrets:
      CLIENT_ID:
        required: false
      CLIENT_SECRET:
        required: false
      SIGNING_KEY:
        required: false
      TOKEN:
        required: false
      ACCESS_TOKEN:
        required: false
      API_KEY:
        required: false
      API_SECRET:
        required: false
      API_SECRET_2:
        required: false
      ENCRYPTION_KEY:
        required: false

permissions:
  contents: read
  packages: read
  id-token: write
  pull-requests: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version_url: ${{ steps.deploy.outputs.version_url }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Resolve app version
        id: resolve-version
        uses: trevorism/actions-workflows/.github/actions/resolve-app-version@master
        with:
          version: ${{ inputs.version }}

      - name: Set up JDK ${{inputs.JDK_VERSION}}
        uses: actions/setup-java@v5.2.0
        with:
          java-version: ${{inputs.JDK_VERSION}}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Chmod gradlew
        run: chmod +x ./gradlew

      - name: Auth with google
        uses: 'google-github-actions/auth@v3'
        with:
          service_account: ${{ format('github-{0}@{0}.iam.gserviceaccount.com', inputs.gcp_project ) }}
          workload_identity_provider: ${{ format('projects/{0}/locations/global/workloadIdentityPools/github-{1}-pool/providers/{1}-provider', inputs.gcp_project_id, inputs.gcp_project) }}

      - name: Create directory
        shell: bash
        run: mkdir -p ./src/main/resources

      - name: Create secrets file
        uses: Amadevus/pwsh-script@v2
        id: script
        with:
          script: |
            Add-Content -Path .\src\main\resources\secrets.properties -Value 'clientId=${{ secrets.CLIENT_ID }}'
            Add-Content -Path .\src\main\resources\secrets.properties -Value 'clientSecret=${{ secrets.CLIENT_SECRET }}'
            Add-Content -Path .\src\main\resources\secrets.properties -Value 'signingKey=${{ secrets.SIGNING_KEY }}'
            Add-Content -Path .\src\main\resources\secrets.properties -Value 'token=${{ secrets.TOKEN }}'
            Add-Content -Path .\src\main\resources\secrets.properties -Value 'accessToken=${{ secrets.ACCESS_TOKEN }}'
            Add-Content -Path .\src\main\resources\secrets.properties -Value 'apiKey=${{ secrets.API_KEY }}'
            Add-Content -Path .\src\main\resources\secrets.properties -Value 'apiSecret=${{ secrets.API_SECRET }}'
            Add-Content -Path .\src\main\resources\secrets.properties -Value 'apiSecret2=${{ secrets.API_SECRET_2 }}'
            Add-Content -Path .\src\main\resources\secrets.properties -Value 'encryptionKey=${{ secrets.ENCRYPTION_KEY }}'
            
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Execute Gradle build
        run: ./gradlew clean appengineStage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Deploy to App Engine'
        id: deploy
        uses: 'google-github-actions/deploy-appengine@v3.0.1'
        with:
          working_directory: "build/staged-app"
          deliverables: 'app.yaml'
          promote: ${{ inputs.promote }}
          version: ${{ steps.resolve-version.outputs.version }}

      - name: Comment candidate URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.version_url }}
          CANDIDATE_VERSION: ${{ steps.resolve-version.outputs.version }}
        with:
          script: |
            const marker = '<!-- pr-candidate-deploy -->';
            const body = `${marker}\n**PR candidate deployed**\n\n`
              + `- Version: \`${process.env.CANDIDATE_VERSION}\`\n`
              + `- Test it here: ${process.env.CANDIDATE_URL}\n\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Get current time
        if: ${{ inputs.promote }}
        uses: josStorer/get-current-time@v2
        id: current-time

      - name: Send deploy event
        if: ${{ inputs.promote }}
        uses: dkershner6/post-api-call-action@v2
        with:
          url: "https://event.data.trevorism.com/event/deploy"
          data: "{\"service\":\"${{ github.event.repository.name }}\",\"gcpProject\":\"${{ inputs.gcp_project }}\",\"version\":\"${{ steps.resolve-version.outputs.version }}\", \"date\":\"${{ steps.current-time.outputs.time }}\"}"
