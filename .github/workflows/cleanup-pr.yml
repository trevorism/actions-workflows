name: Delete a PR candidate App Engine version

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'The project on GCP which is the deploy target.'
        required: true
        type: string
      gcp_project_id:
        description: 'The GCP project id.'
        required: true
        type: string
      version:
        description: 'The App Engine version id to delete'
        required: true
        type: string
      service:
        description: 'App Engine service name (from app.yaml). Defaults to the repo name when empty.'
        required: false
        type: string
        default: ''

permissions: write-all

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Auth with google
        uses: 'google-github-actions/auth@v3'
        with:
          service_account: ${{ format('github-{0}@{0}.iam.gserviceaccount.com', inputs.gcp_project ) }}
          workload_identity_provider: ${{ format('projects/{0}/locations/global/workloadIdentityPools/github-{1}-pool/providers/{1}-provider', inputs.gcp_project_id, inputs.gcp_project) }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: Delete PR candidate version
        env:
          SERVICE: ${{ inputs.service != '' && inputs.service || github.event.repository.name }}
        run: |
          gcloud app versions delete "${{ inputs.version }}" \
            --service="${SERVICE}" \
            --project="${{ inputs.gcp_project }}" \
            --quiet || true
