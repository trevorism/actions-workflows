name: Delete stale PR candidate App Engine versions

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'The project on GCP which is the deploy target.'
        required: true
        type: string
      gcp_project_id:
        description: 'The GCP project id.'
        required: true
        type: string
      version:
        description: 'Deprecated and ignored. Every pr-<number> version whose pull request is not open is deleted.'
        required: false
        type: string
        default: ''
      service:
        description: 'App Engine service name (from app.yaml). Defaults to the repo name when empty.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Auth with google
        uses: 'google-github-actions/auth@v3'
        with:
          service_account: ${{ format('github-{0}@{0}.iam.gserviceaccount.com', inputs.gcp_project ) }}
          workload_identity_provider: ${{ format('projects/{0}/locations/global/workloadIdentityPools/github-{1}-pool/providers/{1}-provider', inputs.gcp_project_id, inputs.gcp_project) }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: Delete PR candidate versions without an open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ inputs.service != '' && inputs.service || github.event.repository.name }}
          GCP_PROJECT: ${{ inputs.gcp_project }}
        run: |
          open_versions=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 1000 --json number --jq '.[] | "pr-\(.number)"')
          pr_versions=$(gcloud app versions list \
            --service="${SERVICE}" \
            --project="${GCP_PROJECT}" \
            --filter="version.id~^pr-[0-9]+$" \
            --format="value(version.id)" || true)

          for version in ${pr_versions}; do
            if grep -qx "${version}" <<< "${open_versions}"; then
              echo "Keeping ${version}: pull request is open"
            else
              echo "Deleting ${version}"
              gcloud app versions delete "${version}" \
                --service="${SERVICE}" \
                --project="${GCP_PROJECT}" \
                --quiet || true
            fi
          done
